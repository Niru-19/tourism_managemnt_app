<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>User Dashboard - Tourism Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: #f8f9fa;">

    <nav class="navbar navbar-dark bg-dark px-4 py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand font-weight-bold" href="packages.html">&larr; Back to Packages</a>
            <span class="text-white">👤 User Dashboard</span>
            <button id="user-logout" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <!-- Left Column: User Profile & Password Update -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm border-0 rounded-lg p-4 bg-white mb-4">
                    <h4 class="text-primary mb-3">Profile Information</h4>
                    <hr>
                    <div class="mb-2">
                        <strong>Username:</strong>
                        <p id="prof-username" class="text-muted mb-1">-</p>
                    </div>
                    <div class="mb-2">
                        <strong>Full Name:</strong>
                        <p id="prof-fullname" class="text-muted mb-1">-</p>
                    </div>
                    <div class="mb-2">
                        <strong>Email Address:</strong>
                        <p id="prof-email" class="text-muted mb-1">-</p>
                    </div>
                </div>

                <!-- Update Password Card -->
                <div class="card shadow-sm border-0 rounded-lg p-4 bg-white">
                    <h5 class="text-dark mb-3">🔒 Change Password</h5>
                    <div id="pass-alert" class="alert d-none" role="alert" style="font-size: 13px;"></div>
                    <form id="change-pass-form">
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 13px;">Current Password</label>
                            <input type="password" id="curr-pass" class="form-control form-control-sm" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 13px;">New Password</label>
                            <input type="password" id="new-pass" class="form-control form-control-sm" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Update Password</button>
                    </form>
                </div>
            </div>

            <!-- Right Column: User's Booked Packages -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-lg p-4 bg-white">
                    <h4 class="text-primary mb-3">✈️ My Booked Packages</h4>
                    <hr>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Destination</th>
                                    <th>Duration</th>
                                    <th>Date</th>
                                    <th>Total Paid</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="user-bookings-table">
                                <tr><td colspan="6" class="text-center">Loading your bookings...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Retrieve and parse the user session safely
            const activeUser = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('user') || localStorage.getItem('loggedUser') || '{}');

            // 2. Validate session
            if (!activeUser || (!activeUser.id && !activeUser.user_id && !activeUser.username)) {
                window.location.href = 'login.html';
                return;
            }

            // 3. Populate profile info safely matching your HTML IDs
            const usernameEl = document.getElementById('prof-username');
            const fullnameEl = document.getElementById('prof-fullname');
            const emailEl = document.getElementById('prof-email');

            if (usernameEl) usernameEl.textContent = activeUser.username || activeUser.Username || 'N/A';
            if (fullnameEl) fullnameEl.textContent = activeUser.full_name || activeUser.fullName || activeUser.Full_Name || 'N/A';
            if (emailEl) emailEl.textContent = activeUser.email || activeUser.Email || 'N/A';

            // 4. Extract user ID and trigger bookings fetch
            const userId = activeUser.user_id || activeUser.id || activeUser.UserId || 5;
            if (userId) {
                loadUserBookings(userId);
            }
        });

        // Logout Handler
        document.getElementById('user-logout')?.addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('user');
            localStorage.removeItem('loggedUser');
            window.location.href = 'index.html';
        });

        // Robust bookings loader mapped directly to table body
        async function loadUserBookings(userId) {
            console.log('🚀 loadUserBookings called with userId:', userId);
            const tableBody = document.getElementById('user-bookings-table');

            try {
                console.log(`📡 Fetching from: /api/user-bookings?userId=${userId}`);
                const response = await fetch(`/api/user-bookings?userId=${userId}`);
                console.log('📥 Response status:', response.status);

                const textResponse = await response.text();
                
                let bookings;
                try {
                    bookings = JSON.parse(textResponse);
                } catch (e) {
                    console.error('❌ Failed to parse JSON:', textResponse);
                    throw new Error('Server returned invalid data format.');
                }

                if (!response.ok) {
                    throw new Error(bookings.error || 'Failed to load bookings.');
                }

                if (!bookings || bookings.length === 0) {
                    console.log('⚠️ No bookings found for this user.');
                    if (tableBody) {
                        tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No booked packages found yet.</td></tr>`;
                    }
                    return;
                }

                console.log('✅ Bookings loaded successfully:', bookings);
                let html = '';

                bookings.forEach(b => {
                    html += `
                        <tr>
                            <td>#${b.booking_id}</td>
                            <td>${b.Destination || 'N/A'}</td>
                            <td>${b.Duration || 'N/A'} days</td>
                            <td>${b.booking_date ? new Date(b.booking_date).toLocaleDateString() : 'N/A'}</td>
                            <td>$${Number(b.total_amount).toFixed(2)}</td>
                            <td><span class="badge bg-success">${b.status || 'Confirmed'}</span></td>
                        </tr>
                    `;
                });
                
                if (tableBody) {
                    tableBody.innerHTML = html;
                }

            } catch (err) {
                console.error('❌ Error in loadUserBookings:', err);
                if (tableBody) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Failed to load bookings: ${err.message}</td></tr>`;
                }
            }
        }

        // --- UPDATE PASSWORD HANDLER ---
        document.getElementById('change-pass-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPassword = document.getElementById('curr-pass').value;
            const newPassword = document.getElementById('new-pass').value;
            const activeUser = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('user') || localStorage.getItem('loggedUser') || '{}');
            const userId = activeUser.user_id || activeUser.id || activeUser.UserId || 5;
            const alertBox = document.getElementById('pass-alert');

            try {
                const response = await fetch('/api/user/change-password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, currentPassword, newPassword })
                });

                const result = await response.json();

                if (response.ok) {
                    alertBox.className = 'alert alert-success d-block';
                    alertBox.textContent = 'Password updated successfully!';
                    document.getElementById('change-pass-form').reset();
                } else {
                    alertBox.className = 'alert alert-danger d-block';
                    alertBox.textContent = result.error || 'Failed to update password.';
                }
            } catch (err) {
                console.error('Error updating password:', err);
                alertBox.className = 'alert alert-danger d-block';
                alertBox.textContent = 'Server connection error while updating password.';
            }
        });
    </script>
</body>
</html>
